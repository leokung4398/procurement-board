<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>初始化關鍵字資料庫</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        #progress-container {
            width: 100%; max-width: 400px; height: 12px; background-color: #f0f0f0;
            border-radius: 6px; margin-top: 15px; display: none; overflow: hidden; border: 1px solid #ccc;
        }
        #progress-bar { height: 100%; width: 0%; background-color: #4CAF50; transition: width 0.2s ease; }
        button { padding:10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>初始化關鍵字資料庫 (8大分類版本)</h1>
    <button id="seedBtn">點擊初始化 / 更新資料庫</button>
    <div id="progress-container"><div id="progress-bar"></div></div>
    <div id="status" style="margin-top:20px; font-weight:bold; font-size: 15px;"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const categories = [
            {
                id: "c1", name: "一、採購管理", isActive: true, order: 1,
                keywords: [
                    "採購進度更新", "採購案件追蹤", "採購完成通知", "延遲原因說明", "其他進度事項",
                    "詢價需求通知", "RFQ報價邀請", "報價回覆通知", "報價異動通知", "價格調整通知",
                    "維修報價通知", "PO異動通知", "PO取消通知", "數量變更通知", "規格變更通知", "交貨地點異動通知"
                ].map((k, i) => ({ id: `kw1_${i+1}`, text: k, isActive: true, order: i+1 }))
            },
            {
                id: "c2", name: "二、供應商管理", isActive: true, order: 2,
                keywords: [
                    "供應商新增", "供應商資料異動", "供應商資格審查", "供應商評鑑結果", "供應商稽核通知",
                    "供應商停用", "供應商恢復", "供應商作業通知", "交付要求通知", "包裝要求通知",
                    "出貨規範通知", "供應商會議通知", "供應商公告事項"
                ].map((k, i) => ({ id: `kw2_${i+1}`, text: k, isActive: true, order: i+1 }))
            },
            {
                id: "c3", name: "三、品質管理", isActive: true, order: 3,
                keywords: [
                    "來料品質異常通知", "不良品退貨通知", "不良品換貨通知", "返修處理通知",
                    "8D改善報告", "品質改善結果通知"
                ].map((k, i) => ({ id: `kw3_${i+1}`, text: k, isActive: true, order: i+1 }))
            },
            {
                id: "c4", name: "四、工程管理", isActive: true, order: 4,
                keywords: [
                    "ECN工程變更通知", "ECR工程變更通知", "BOM變更通知", "圖面變更通知",
                    "規格變更通知", "料號變更通知", "規格停用通知", "料號停用通知", "變更生效通知"
                ].map((k, i) => ({ id: `kw4_${i+1}`, text: k, isActive: true, order: i+1 }))
            },
            {
                id: "c5", name: "五、物流管理", isActive: true, order: 5,
                keywords: [
                    "交貨安排通知", "交貨異常通知", "交期異動通知", "交期延期通知",
                    "物料短缺通知", "交貨地點變更通知", "文件缺件通知", "文件補件通知", "回收物料處理通知"
                ].map((k, i) => ({ id: `kw5_${i+1}`, text: k, isActive: true, order: i+1 }))
            },
            {
                id: "c6", name: "六、文件管理", isActive: true, order: 6,
                keywords: [
                    "表單範本", "作業文件", "規格文件", "圖面資料", "報告文件", "其他附件"
                ].map((k, i) => ({ id: `kw6_${i+1}`, text: k, isActive: true, order: i+1 }))
            },
            {
                id: "c7", name: "七、公告管理", isActive: true, order: 7,
                keywords: [
                    "採購政策公告", "採購流程公告", "作業規範公告", "採購注意事項", "重要事項通知",
                    "其他採購公告", "系統維護通知", "系統功能更新", "操作說明公告", "權限異動通知",
                    "系統異常通知", "其他系統公告"
                ].map((k, i) => ({ id: `kw7_${i+1}`, text: k, isActive: true, order: i+1 }))
            },
            {
                id: "c8", name: "八、其他", isActive: true, order: 8,
                keywords: [
                    "流程異動通知", "作業調整通知", "特殊案件通知", "臨時事項通知", "跨部門協調事項"
                ].map((k, i) => ({ id: `kw8_${i+1}`, text: k, isActive: true, order: i+1 }))
            }
        ];

        document.getElementById('seedBtn').addEventListener('click', async () => {
            const btn = document.getElementById('seedBtn');
            const status = document.getElementById('status');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            
            btn.disabled = true;
            progressContainer.style.display = 'block';
            status.style.color = '#333';
            status.textContent = "資料更新中，請稍候...";
            
            let p = 0;
            const interval = setInterval(() => { p += 10; if(p<=90) progressBar.style.width = p + "%"; }, 100);

            try {
                await db.collection("dictionary").doc("keywords").set({ categories });
                clearInterval(interval);
                progressBar.style.width = "100%";
                status.style.color = 'green';
                status.textContent = "✅ 更新成功！目前已設定為最新的 8 大分類。";
            } catch(e) {
                clearInterval(interval);
                status.style.color = 'red';
                status.textContent = "❌ 更新失敗：" + e.message;
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
