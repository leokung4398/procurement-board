<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>初始化關鍵字資料庫</title>
    <style>
        #progress-container {
            width: 100%;
            max-width: 400px;
            height: 12px;
            background-color: #f0f0f0;
            border-radius: 6px;
            margin-top: 15px;
            display: none;
            overflow: hidden;
            border: 1px solid #ccc;
        }
        #progress-bar {
            height: 100%;
            width: 0%;
            background-color: #4CAF50;
            border-radius: 6px;
            transition: width 0.2s ease, background-color 0.2s;
        }
        #seedBtn:disabled {
            background-color: #ccc;
            cursor: not-allowed;
            color: #666;
        }
    </style>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>初始化關鍵字資料庫</h1>
    <button id="seedBtn" style="padding:10px 20px; font-size: 16px; cursor: pointer;">開始初始化資料</button>
    <div id="progress-container">
        <div id="progress-bar"></div>
    </div>
    <div id="status" style="margin-top:20px; font-weight:bold; font-size: 15px;"></div>

    <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.3/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        const categories = [
            {
                id: "c1", name: "一、採購作業進度", isActive: true, order: 1,
                keywords: [
                    { id: "k1_1", text: "採購進度更新", isActive: true, order: 1 },
                    { id: "k1_2", text: "採購案件追蹤", isActive: true, order: 2 },
                    { id: "k1_3", text: "採購完成通知", isActive: true, order: 3 },
                    { id: "k1_4", text: "延遲原因說明", isActive: true, order: 4 },
                    { id: "k1_5", text: "其他進度事項", isActive: true, order: 5 }
                ]
            },
            {
                id: "c2", name: "二、詢價／報價作業", isActive: true, order: 2,
                keywords: [
                    { id: "k2_1", text: "詢價需求通知", isActive: true, order: 1 },
                    { id: "k2_2", text: "RFQ報價邀請", isActive: true, order: 2 },
                    { id: "k2_3", text: "報價回覆/異動通知", isActive: true, order: 3 },
                    { id: "k2_4", text: "價格調整/異動通知", isActive: true, order: 4 },
                    { id: "k2_5", text: "維修報價通知", isActive: true, order: 5 }
                ]
            },
            {

                keywords: [

                    { id: "k3_2", text: "數量變更通知", isActive: true, order: 2 },
                    { id: "k3_3", text: "規格變更通知", isActive: true, order: 3 },
                    { id: "k3_4", text: "交貨地點異動通知", isActive: true, order: 4 }
                ]
            },
            {
                id: "c4", name: "四、供應商管理作業", isActive: true, order: 4,
                keywords: [
                    { id: "k4_1", text: "供應商新增", isActive: true, order: 1 },
                    { id: "k4_2", text: "供應商資料異動", isActive: true, order: 2 },
                    { id: "k4_3", text: "供應商資格審查", isActive: true, order: 3 },

                    { id: "k4_6", text: "供應商停用／恢復", isActive: true, order: 6 }
                ]
            },

                keywords: [
                    { id: "k5_1", text: "交貨安排通知", isActive: true, order: 1 },
                    { id: "k5_2", text: "交貨異常通知", isActive: true, order: 2 },
                    { id: "k5_3", text: "交期異動/延期通知", isActive: true, order: 3 },

                    { id: "k5_5", text: "交貨地點變更通知", isActive: true, order: 5 },

                ]
            },

            {

                keywords: [
                    { id: "k8_1", text: "採購政策公告", isActive: true, order: 1 },
                    { id: "k8_2", text: "採購流程公告", isActive: true, order: 2 },
                    { id: "k8_3", text: "作業規範公告", isActive: true, order: 3 },
                    { id: "k8_4", text: "採購注意事項", isActive: true, order: 4 },

                ]
            },
            {

                keywords: [

                ]
            },
            {

                    { id: "k10_5", text: "報告文件", isActive: true, order: 5 },
                    { id: "k10_6", text: "其他附件", isActive: true, order: 6 }
                ]
            },
            {
                id: "c11", name: "十一、供應商通知", isActive: true, order: 11,
                keywords: [
                    { id: "k11_1", text: "供應商作業通知", isActive: true, order: 1 },
                    { id: "k11_2", text: "交付要求通知", isActive: true, order: 2 },
                    { id: "k11_3", text: "包裝要求通知", isActive: true, order: 3 },
                    { id: "k11_4", text: "出貨規範通知", isActive: true, order: 4 },
                    { id: "k11_5", text: "供應商會議通知", isActive: true, order: 5 },
                    { id: "k11_6", text: "供應商公告事項", isActive: true, order: 6 }
                ]
            },
            {
                id: "c12", name: "十二、系統公告", isActive: true, order: 12,
                keywords: [
                    { id: "k12_1", text: "系統維護通知", isActive: true, order: 1 },
                    { id: "k12_2", text: "系統功能更新", isActive: true, order: 2 },
                    { id: "k12_3", text: "操作說明公告", isActive: true, order: 3 },
                    { id: "k12_4", text: "權限異動通知", isActive: true, order: 4 },
                    { id: "k12_5", text: "系統異常通知", isActive: true, order: 5 },
                    { id: "k12_6", text: "其他系統公告", isActive: true, order: 6 }
                ]
            }
        ];

        document.getElementById('seedBtn').addEventListener('click', async (e) => {
            const btn = e.target;
            const statusDiv = document.getElementById('status');
            const progressContainer = document.getElementById('progress-container');
            const progressBar = document.getElementById('progress-bar');
            
            btn.disabled = true;
            btn.textContent = "正在寫入資料庫...";
            progressContainer.style.display = 'block';
            statusDiv.textContent = "連線至 Firebase...";
            statusDiv.style.color = "#333";
            
            // 模擬進度條動畫
            let p = 0;
            const interval = setInterval(() => {
                p += Math.random() * 15;
                if(p > 90) p = 90;
                progressBar.style.width = p + "%";
            }, 100);

            try {
                await db.collection("dictionary").doc("keywords").set({ categories });
                clearInterval(interval);
                progressBar.style.width = "100%";
                statusDiv.textContent = "✅ 資料庫初始化完成！已寫入 12 個母標題與 63 個子標題。";
                statusDiv.style.color = "green";
                btn.textContent = "初始化成功";
            } catch (err) {
                clearInterval(interval);
                progressBar.style.backgroundColor = "red";
                console.error(err);
                statusDiv.textContent = "❌ 寫入失敗: " + err.message;
                statusDiv.style.color = "red";
                btn.disabled = false;
                btn.textContent = "開始初始化資料";
            }
        });
    </script>
</body>
</html>
